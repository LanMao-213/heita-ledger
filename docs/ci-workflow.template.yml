# ⚠️ 这是模板，不是生效的 CI 配置。
#
# 为什么放在这里而不是 .github/workflows/：GitHub 令牌若没有 `workflow` scope，
# 推送 `.github/workflows/**` 会被**整次 push 拒绝**（不是只拒那一个文件）：
#   refusing to allow an OAuth App to create or update workflow ... without workflow scope
# 放在 docs/ 下，任何人 `git add -A` 都不会踩这个坑。
#
# ✅ 2026-10-20：1.4.5 分支上已落地为 `.github/workflows/ci.yml`。
# 这份模板保留作备份与差异对照 —— 改 CI 时两处要同步，否则下次照着模板重建会丢改动。
#
# ⚠️ 推 `.github/workflows/**` 需要令牌带 `workflow` scope，缺了是**整次 push 被拒**：
#   gh auth refresh -h github.com -s workflow      # 浏览器里确认，令牌多一个 scope
# 这台机器上的 gh 令牌没有这个 scope，所以要由带 scope 的账号推一次。

name: 测试与静态检查

# 为什么加这个（1.4.4）：仓库里除了 owner 还有一位 write 权限的协作者，
# 而 256 条测试一直靠人手动跑 —— 1.4.1 的真机事故里，有两个就是「改动碰了
# 查询层、没人拦」造成的。把 analyze + test 挂在 push/PR 上，是这里最便宜的护栏。
#
# 版本与本地工具链对齐（`flutter --version` → 3.47.7）。升 Flutter 时记得同步改
# 下面这一行，否则 CI 用旧 SDK 跑、本地用新的，报警会失真。

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      # 先跑这条：它不依赖 Flutter，几秒钟就能判断「有没有混进联网的东西」。
      # 放在最前面是为了让这类问题在最便宜的地方失败，而不是等到测试跑完。
      - name: 不联网门禁
        run: bash tools/check_no_network.sh

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: 取依赖
        run: flutter pub get

      - name: 静态检查
        run: flutter analyze

      # 不加 --coverage：这个项目还没有覆盖率门槛，先让「跑没跑过」变成硬约束
      - name: 测试
        run: flutter test --reporter expanded

  # 产物级门禁：源码扫描可能被绕过（反射、动态拼接），但**发布包里没有 INTERNET
  # 权限**是系统级的硬事实 —— 发不出去就是发不出去。
  #
  # 换成检查「合并后的清单」而不是打整包（1.4.6+）：
  # 权限只来自清单，而 aapt2 dump badging 读的也就是这个清单，所以两者证明的是
  # 同一件事；但清单任务跳掉了 Dart AOT 与打包，实测这一步 296s → 20s 量级
  # （冷缓存时主要花在下载 gradle 依赖，已加缓存）。省下来的时间换成了「PR 上也跑」——
  # 原来只在 main 上跑，等于问题合进来了才报警。
  release-permissions:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      # 只缓存 gradle 本体（~200MB，distributionUrl 走腾讯镜像），不缓存
      # ~/.gradle/caches。实测过：把 caches 一起缓存，第二次跑虽然快（75s vs 172s），
      # 但 AGP 在配置阶段装 NDK（ndkVersion = flutter.ndkVersion，约 40s）会失败 ——
      # 报的是 commons-compress 的 ZipFile 异常，即拿到的安装包被判为损坏。
      # 稳定 > 省那 70 秒，所以只留 wrapper。
      - uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper
          key: gradle-wrapper-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-wrapper-${{ runner.os }}-

      - run: flutter pub get

      # 只生成构建配置（写出 android/local.properties，gradle 靠它找 flutter.sdk），
      # 不编译 Dart、不打 APK。没有这一步 gradle 会报 flutter.sdk 未设置。
      - name: 生成构建配置
        run: flutter build apk --release --target-platform android-arm64 --config-only

      - name: 合并 release 清单
        run: cd android && ./gradlew :app:processReleaseManifest --console=plain

      - name: 检查合并后的权限
        run: |
          M=$(find build/app/intermediates -ipath '*merged_manifests/release*' -name AndroidManifest.xml | head -1)
          if [ -z "$M" ]; then
            echo "::error::没找到合并后的清单 —— 构建目录结构可能随 AGP 版本变了，先看下面列出来的"
            find build/app/intermediates -name AndroidManifest.xml | head -20
            exit 1
          fi
          echo "清单：$M"
          bash tools/check_no_network.sh "$M"
