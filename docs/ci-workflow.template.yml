# ⚠️ 这是模板，不是生效的 CI 配置。
#
# 为什么放在这里而不是 .github/workflows/：GitHub 令牌若没有 `workflow` scope，
# 推送 `.github/workflows/**` 会被**整次 push 拒绝**（不是只拒那一个文件）：
#   refusing to allow an OAuth App to create or update workflow ... without workflow scope
# 放在 docs/ 下，任何人 `git add -A` 都不会踩这个坑。
#
# ✅ 2026-10-20：1.4.5 分支上已落地为 `.github/workflows/ci.yml`。
# 这份模板保留作备份与差异对照 —— 改 CI 时两处要同步，否则下次照着模板重建会丢改动。
#
# ⚠️ 推 `.github/workflows/**` 需要令牌带 `workflow` scope，缺了是**整次 push 被拒**：
#   gh auth refresh -h github.com -s workflow      # 浏览器里确认，令牌多一个 scope
# 这台机器上的 gh 令牌没有这个 scope，所以要由带 scope 的账号推一次。

name: 测试与静态检查

# 为什么加这个（1.4.4）：仓库里除了 owner 还有一位 write 权限的协作者，
# 而 256 条测试一直靠人手动跑 —— 1.4.1 的真机事故里，有两个就是「改动碰了
# 查询层、没人拦」造成的。把 analyze + test 挂在 push/PR 上，是这里最便宜的护栏。
#
# 版本与本地工具链对齐（`flutter --version` → 3.47.7）。升 Flutter 时记得同步改
# 下面这一行，否则 CI 用旧 SDK 跑、本地用新的，报警会失真。

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      # 先跑这条：它不依赖 Flutter，几秒钟就能判断「有没有混进联网的东西」。
      # 放在最前面是为了让这类问题在最便宜的地方失败，而不是等到测试跑完。
      - name: 不联网门禁
        run: bash tools/check_no_network.sh

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: 取依赖
        run: flutter pub get

      # --fatal-infos：`flutter analyze` 默认**不把 info 当失败**（退出码仍是 0），
      # 于是「未使用的插值、多余的 import」这类提示会一路溜进 main。
      # 本机与 CI 都固定在 3.47.7，info 集合一致，因此可以把它当硬门禁。
      - name: 静态检查
        run: flutter analyze --fatal-infos

      # 不加 --coverage：这个项目还没有覆盖率门槛，先让「跑没跑过」变成硬约束
      - name: 测试
        run: flutter test --reporter expanded

  # 产物级门禁：源码扫描可能被绕过（反射、动态拼接），但**APK 里没有 INTERNET
  # 权限**是系统级的硬事实 —— 发不出去就是发不出去。
  # 只在 main 上跑：build 要几分钟，每个分支都跑性价比太低。
  apk-permission:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - run: flutter pub get

      # 仓库里没有 release.jks / key.properties，会退回 debug 签名 ——
      # 这条 job 只关心「权限清单」，不关心签名。
      - name: 构建 release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: 检查 APK 权限
        run: |
          APK=$(ls build/app/outputs/flutter-apk/*-release.apk | head -1)
          bash tools/check_no_network.sh "$APK"
