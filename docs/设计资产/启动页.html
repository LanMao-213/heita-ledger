<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>黑塔消费日记 · 启动页</title>
<style>
:root{ --k:#14161A; --w:#FFFFFF; }
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  background:#E8EAEF;display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;padding:24px;gap:12px;overflow:auto;-webkit-font-smoothing:antialiased;
}
.stage{transform-origin:center center}
.phone{
  position:relative;width:390px;height:844px;background:var(--k);
  border-radius:46px;display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 0 0 11px #16181C, 0 0 0 12.5px #3B4048, 0 26px 50px rgba(12,18,30,.34);
}

.splash{position:absolute;inset:0;background:var(--k);transition:background .35s ease}
.splash.light{background:var(--w)}
.splash .statusbar{
  position:absolute;top:0;left:0;right:0;height:44px;display:flex;align-items:center;
  justify-content:space-between;padding:0 26px 0 30px;font-size:13.5px;font-weight:500;
  color:#fff;transition:color .35s ease,opacity .25s ease;z-index:2;
}
.splash.light .statusbar{color:var(--k)}
.splash.hidestatus .statusbar{opacity:0}

/* 标志绝对居中——尺寸超出画面时也能保证四周溢出均匀 */
.logo{position:absolute;left:50%;top:50%;opacity:0;
  transform:translate(-50%,-50%) scale(.9);transform-origin:center center}
.logo svg{display:block}
.play .logo{animation:brandIn 1s cubic-bezier(.16,.84,.28,1) forwards}
@keyframes brandIn{
  from{opacity:0;transform:translate(-50%,-50%) scale(.9)}
  to  {opacity:1;transform:translate(-50%,-50%) scale(1)}
}
.flame{transform-box:fill-box;transform-origin:bottom center}
.play .flame{animation:flicker 2.4s ease-in-out 1s infinite}
@keyframes flicker{
  0%,100%{transform:scale(1);opacity:1}
  38%{transform:scale(.955);opacity:.86}
  62%{transform:scale(1.03);opacity:1}
}

.ctrl{display:flex;align-items:center;gap:7px;background:#fff;border:1px solid #E1E5EB;
  border-radius:13px;padding:5px 8px 5px 14px;box-shadow:0 2px 10px rgba(12,18,30,.07);
  font-size:12.5px;color:#6C737E;flex-wrap:wrap;justify-content:center}
.ctrl b{font-weight:500;color:#15181C;margin-right:3px}
.ctrl button{border:0;background:#F5F6F8;font-family:inherit;font-size:12.5px;color:#3D434D;
  padding:8px 14px;border-radius:9px;cursor:pointer;transition:.15s}
.ctrl button:hover{background:#ECEEF2}
.ctrl button.on{background:#14161A;color:#fff;font-weight:500}
.caption{font-size:12.5px;color:#69707C;text-align:center;line-height:1.75;max-width:540px}
.caption b{font-weight:500;color:#3D434D}

@media (max-height:1000px){ .stage{transform:scale(.85)} }
@media (max-height:850px){ .stage{transform:scale(.72)} }
@media (max-width:560px){
  body{padding:0;background:#fff}
  .stage{transform:none!important;width:100%}
  .phone{width:100vw;height:100vh;border-radius:0;box-shadow:none}
  .caption,.ctrl{display:none}
}
</style>
</head>
<body>

<div class="stage">
  <div class="phone">
    <div class="splash play" id="splash">
      <div class="statusbar">
        <span id="clock">09:41</span>
        <div style="display:flex;align-items:center;gap:5px">
          <i style="display:block;width:3px;height:6px;background:currentColor;border-radius:1px"></i>
          <i style="display:block;width:3px;height:8px;background:currentColor;border-radius:1px"></i>
          <i style="display:block;width:3px;height:10px;background:currentColor;border-radius:1px"></i>
          <i style="display:block;width:3px;height:12px;background:currentColor;border-radius:1px"></i>
          <svg width="15" height="11" viewBox="0 0 15 11" style="margin:0 3px"><path d="M1 4a9 9 0 0113 0M3.4 6.6a5.6 5.6 0 018.2 0" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/><circle cx="7.5" cy="9.3" r="1.1" fill="currentColor"/></svg>
          <svg width="24" height="12" viewBox="0 0 24 12"><rect x="0.5" y="0.5" width="19" height="11" rx="3.2" stroke="currentColor" stroke-opacity=".4" fill="none"/><rect x="2.5" y="2.5" width="14" height="7" rx="1.6" fill="currentColor"/><path d="M21.5 4v4a2.2 2.2 0 000-4z" fill="currentColor" fill-opacity=".45"/></svg>
        </div>
      </div>

      <div class="logo" id="logo"></div>
    </div>
  </div>
</div>

<div class="ctrl">
  <b>尺寸版本</b>
  <button data-k="0.88" class="on">D · 留白 88% ✓</button>
  <button data-k="1">A · 满宽 100%</button>
  <button data-k="1.06">B · 满屏 106%</button>
  <button data-k="1.12">C · 出血 112%</button>
</div>
<div class="ctrl">
  <b>其他</b>
  <button data-s="dark" class="on">深色底</button>
  <button data-s="light">浅色底</button>
  <button id="togStat">隐藏状态栏</button>
  <button id="replay">重新播放</button>
</div>

<p class="caption">
  <b>定稿：D · 留白 88%</b>　标志 343×712px，占屏高 84%，上下各留 66px。<br>

function paint(){

};

});
document.querySelectorAll('.ctrl button[data-s]').forEach(b => b.onclick = ()=>{

});
