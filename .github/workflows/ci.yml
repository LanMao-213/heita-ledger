# 测试与静态检查。
#
# 来源：docs/ci-workflow.template.yml（落地时删掉模板头）。
# 本地跑同一条链：flutter analyze && flutter test && bash tools/check_no_network.sh
#
name: 测试与静态检查

# 为什么加这个（1.4.4）：仓库里除了 owner 还有一位 write 权限的协作者，
# 而 256 条测试一直靠人手动跑 —— 1.4.1 的真机事故里，有两个就是「改动碰了
# 查询层、没人拦」造成的。把 analyze + test 挂在 push/PR 上，是这里最便宜的护栏。
#
# 版本与本地工具链对齐（`flutter --version` → 3.47.7）。升 Flutter 时记得同步改
# 下面这一行，否则 CI 用旧 SDK 跑、本地用新的，报警会失真。

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # fetch-depth: 0 是**必须**的，不是顺手加的。
      #
      # 默认 checkout 只拉 1 个提交，`--history` 于是只看得见这一个 ——
      # 扫描器会报「历史干净」，而它根本没看过历史。这个仓库已经因为
      # 「范围默认错了」栽过三次（工作树→历史树→提交信息），所以这里
      # 不留任何默认值。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 先跑这条：它不依赖 Flutter，几秒钟就能判断「有没有混进联网的东西」。
      # 放在最前面是为了让这类问题在最便宜的地方失败，而不是等到测试跑完。
      - name: 不联网门禁
        run: bash tools/check_no_network.sh

      # 与上一条同级的「便宜且致命」检查：密钥/令牌/本机路径/个人信息。
      # --history 扫每个提交的文件树，--messages 扫提交信息 —— 后者是
      # 2026-10-28 补上的，起因是三条提交信息在解释「已脱敏」时自己写着
      # 真实路径，而当时的脚本只扫树，全程报 clean。
      - name: 隐私扫描（文件树 + 历史 + 提交信息）
        run: python tools/privacy_scan.py --history --messages

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: 取依赖
        run: flutter pub get

      # 截图测试会把界面真的渲染出来，所以必须装中文字体。
      # ubuntu runner 默认没有 CJK 字体，缺了中文会渲染成方块；方块的字宽和
      # 真实汉字不同，会让布局断言报出「溢出 95px」这类**假阳性**（1.4.6 踩过）。
      # 反过来更要命：`test/ui_shot_test.dart` 的 `_loadChineseFont` 找不到字体时
      # **只警告不报错**，于是「没有字体也全绿」——中文字体下的真实溢出检不出来。
      # 字体路径与该测试里的加载路径一一对应。
      - name: 安装中文字体
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-droid-fallback

      # --fatal-infos：`flutter analyze` 默认**不把 info 当失败**（退出码仍是 0），
      # 于是「未使用的插值、多余的 import」这类提示会一路溜进 main。
      # 本机与 CI 都固定在 3.47.7，info 集合一致，因此可以把它当硬门禁。
      - name: 静态检查
        run: flutter analyze --fatal-infos

      # 不加 --coverage：这个项目还没有覆盖率门槛，先让「跑没跑过」变成硬约束
      - name: 测试
        run: flutter test --reporter expanded

      # 这里原先还有一遍 `flutter test --dart-define=HEITA=1`，作用是"再验一次
      # 第二套配色"——那是 **1.4.20 及以前**的形态：配色由编译期常量 `kHeita` 决定，
      # 一个包只编得进一套。
      #
      # 1.4.21 起改成运行时换肤（`ThemeCtrl` + 六套 `Palette`），`kHeita` 已从代码里
      # 彻底删除。于是这条 step 只是把一个**不存在的** dart-define 传进去，再原样跑
      # 一遍同样的 574 条测试：多花约 25 秒，却在注释里告诉后来人"第二套配色是编译期
      # 开关"，是比浪费更糟的事——它会让下一个人以为改配色要改编译参数。
      #
      # 2026-10-28 删除。真要守配色，该守的是"六套皮肤都能构建且换肤不崩"，
      # 那属于 `test/theme_*` 的射程，不是多跑一遍全量测试。

  # 产物级门禁：源码扫描可能被绕过（反射、动态拼接），但**发布包里没有 INTERNET
  # 权限**是系统级的硬事实 —— 发不出去就是发不出去。
  #
  # 换成检查「合并后的清单」而不是打整包：权限只来自清单，而 aapt2 dump badging
  # 读的也就是这个清单，所以两者证明的是同一件事；但清单任务跳掉了 Dart AOT 与
  # 打包，实测 296s → 20s 量级。省下来的时间换成了「PR 上也跑」——原来只在 main
  # 上跑，等于问题合进来了才报警。
  release-permissions:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      # 只缓存 gradle 本体（~200MB），不缓存 ~/.gradle/caches。实测过：把 caches
      # 一起缓存，第二次跑虽然快（75s vs 172s），但 AGP 在配置阶段装 NDK 会失败
      # （报 commons-compress 的 ZipFile 异常，即安装包被判为损坏）。稳定优先。
      - uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper
          key: gradle-wrapper-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-wrapper-${{ runner.os }}-

      - run: flutter pub get

      # 只生成构建配置（写出 android/local.properties，gradle 靠它找 flutter.sdk），
      # 不编译 Dart、不打 APK。没有这一步 gradle 会报 flutter.sdk 未设置。
      - name: 生成构建配置
        run: flutter build apk --release --target-platform android-arm64 --config-only

      - name: 合并 release 清单
        run: cd android && ./gradlew :app:processReleaseManifest --console=plain

      - name: 检查合并后的权限
        run: |
          M=$(find build/app/intermediates -ipath '*merged_manifests/release*' -name AndroidManifest.xml | head -1)
          if [ -z "$M" ]; then
            echo "::error::没找到合并后的清单 —— 构建目录结构可能随 AGP 版本变了，先看下面列出来的"
            find build/app/intermediates -name AndroidManifest.xml | head -20
            exit 1
          fi
          echo "清单：$M"
          bash tools/check_no_network.sh "$M"
